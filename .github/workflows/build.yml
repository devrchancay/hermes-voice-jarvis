name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        working-directory: HermesVoice
        run: |
          set -o pipefail
          xcodebuild \
            -project HermesVoice.xcodeproj \
            -scheme HermesVoice \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        working-directory: HermesVoice
        run: |
          set -o pipefail
          xcodebuild \
            -project HermesVoice.xcodeproj \
            -scheme HermesVoice \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
